	<style>
/* Absolute Positioning Setup */
    .input-wrapper {
      position: relative;
      height: 200px; /* Gives the background text room to show */
    }
/* Background Text Layer */
    .bg-text-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1; /* Sits behind the input */
      font-size: 4rem;
      font-weight: 900;
      color: #e9ecef; /* Light gray Bootstrap color */
      text-transform: uppercase;
      overflow: hidden;
      user-select: none; /* Prevents users from highlighting background text */
      pointer-events: none; /* Allows clicks to pass through to the input */
    }
    /* Foreground Input Layer */
    .fg-input {
      position: relative;
      z-index: 2; /* Sits on top of the text */
      background: transparent; /* Allows background text to be visible underneath */
    }
  </style>

<!-- Text Input -->
<div class="container mt-5">
 		 <input 
	 	type="text" 
	 	id="userInput" 
	  	class="form-control" 
	  	rows="10"
	  	placeholder="Type Here"> 
	</div>
</div>

<!-- Background Display Element -->
<div class="text-center mt-3">
  <div id="outputDisplay" class="display-4 text-bold"></div>
</div>

<script>
  // JavaScript to handle live update
  const input = document.getElementById('userInput');
  const output = document.getElementById('outputDisplay');

  input.addEventListener('input', function() {
    output.textContent = input.value;
  });
</script>
